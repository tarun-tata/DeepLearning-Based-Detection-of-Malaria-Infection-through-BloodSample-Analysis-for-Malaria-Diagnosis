{% extends "base.html" %} {% block content %}
<div class="row">
    <div class="col-md-3 sidebar">
        <button class="btn btn-sidebar mb-2 w-100" id="btn-upload-dataset">Upload Dataset</button>
        <button class="btn btn-sidebar mb-2 w-100" id="btn-preprocess">Image Processing & Normalization</button>
        <button class="btn btn-sidebar mb-2 w-100" id="btn-gnb">GNB Classifier</button>
        <button class="btn btn-sidebar mb-2 w-100" id="btn-train-cnn">Build & Train CNN Model</button>
        <button class="btn btn-sidebar mb-2 w-100" id="btn-upload-test">Upload Test Image & Classify</button>
        <button class="btn btn-sidebar mb-2 w-100" id="btn-performance">Performance Graph</button>
        <button class="btn btn-sidebar mb-2 w-100" id="btn-exit">Exit</button>
    </div>
    <div class="col-md-9">
        <div class="output-box" id="output-area">
            <!-- Output will be displayed here -->
        </div>
        
        <div id="upload-section" style="display:none;">
            <div class="card shadow-sm mt-3">
                <div class="card-body">
                    <h4 class="card-title text-primary">Upload Blood Smear Image</h4>
                    <p class="text-muted small mb-3">Please upload a clear image of the cell for accurate classification.</p>
                    <form id="upload-file" method="post" enctype="multipart/form-data">
                        <input type="file" name="file" id="imageUpload" accept=".png, .jpg, .jpeg" style="display:none;">
                        <label for="imageUpload" class="btn btn-outline-primary btn-block py-3">
                            <i class="fas fa-cloud-upload-alt mr-2"></i> Choose Image File
                        </label>
                    </form>
                    <div id="image-preview-container" class="mt-3 text-center" style="display:none;">
                        <div id="imagePreview" class="mx-auto" style="width: 224px; height: 224px; background-size: contain; background-repeat: no-repeat; background-position: center; border: 2px solid #3498db; border-radius: 8px;"></div>
                        <button type="button" class="btn btn-success btn-lg mt-3 w-100" id="btn-predict">Classify Image</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
